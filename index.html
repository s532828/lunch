<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#8a8175;--ac:#e8590c;--acx:#fff;--bd:#e8e1d6;--ok:#2f9e44;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#27241f;--tx:#f1ece3;--mu:#a29a8c;--ac:#ff8f4d;--acx:#1c1a17;--bd:#3a352d;--ok:#69db7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#27241f;--tx:#f1ece3;--mu:#a29a8c;--ac:#ff8f4d;--acx:#1c1a17;--bd:#3a352d;--ok:#69db7c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mu);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
textarea{min-height:110px}
.row{display:flex;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:var(--acx);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
.item.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.price{color:var(--mu)}
.qty{display:flex;align-items:center;gap:10px}.qty button{padding:4px 12px}.qty b{min-width:16px;text-align:center}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
.badge.open{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.tot{font-weight:700;padding-top:10px;display:flex;justify-content:space-between}
.mine{color:var(--ok);font-size:14px;margin:6px 0}
a{color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.hd{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}.hd small{color:var(--mu)}
#toast{pointer-events:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:#c92a2a;color:#fff;padding:12px 14px;border-radius:12px;z-index:50;font-size:15px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.names{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>

    document.getElementById("bk").onclick=function(e){e.preventDefault();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cache)],{type:"application/json"}));a.download="lunch-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
    document.getElementById("rs").onclick=function(e){e.preventDefault();document.getElementById("rf").click()};
    document.getElementById("rf").onchange=function(e){var r=new FileReader();r.onload=function(){try{cache=JSON.parse(r.result);save();location.reload()}catch(x){alert("檔案格式不對")}};if(e.target.files[0])r.readAsText(e.target.files[0])};
  });
})();
</script>
<script>
var db=null,user=null,me=null,isOrg=false,state=null,orders=[],names={},cart=null,draftOrderNote=null,ready=false,hist=[],view="main",openDay=null,previewShop=null,proxyMode=false,pcart={},pname="",roster=[],smap={},changing=false,who=(function(){try{return localStorage.getItem("who")||""}catch(e){return ""}})(),shops=[],editId=null,adding=false,draftName="",draftMenu="",draftPhone="",draftMobile="",draftNote="";
var $=function(id){return document.getElementById(id)};
var armed=null,armedT=null,manualCopy=null,toastT=null;
function toast(msg){
  var el=$("toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el)}
  el.textContent=msg;el.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){el.style.display="none"},7000);
}
function askTwice(msg,key){
  if(armed===key){armed=null;return true}
  armed=key;clearTimeout(armedT);armedT=setTimeout(function(){armed=null},4000);
  toast(msg+"（請在 4 秒內再按一次）");return false;
}
window.addEventListener("error",function(e){toast("發生錯誤："+(e.message||e))});
window.addEventListener("unhandledrejection",function(e){toast("發生錯誤："+((e.reason&&e.reason.message)||e.reason))});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pastDeadline(){return !state||state.status!=="open"}
function itemOf(no){return (state.menu||[]).find(function(m){return m.no===no})}

function render(){
  var a=$("app");
  if(!ready){return}
  if(!db){a.innerHTML='<div class="empty">此頁需要在 Claude 內開啟，才能同步大家的訂單。</div>';return}
  var h='<h1>🍱 其承午餐系統</h1><div class="row" style="margin:8px 0 12px"><button'+(view==="main"?'':' class="g"')+' data-view="main" style="flex:1">今日</button><button'+(view==="hist"?'':' class="g"')+' data-view="hist" style="flex:1">📅 歷史紀錄</button></div>';
  if(view==="hist"){a.innerHTML=h+histView();return}
  if(!state){
    h+='<div class="sub">目前沒有進行中的團</div>';
    h+= isOrg?setupForm():'<div class="empty">請等團主開團</div>';
    a.innerHTML=h;return;
  }
  var closed=pastDeadline();if(closed)proxyMode=false;
  h+='<div class="sub">'+esc(state.shop)+' <span class="badge '+(closed?'':'open')+'">'+(closed?'已結單':'接單中')+'</span></div>';
  if(state.phone||state.mobile||state.note){h+='<div class="sub">'+(state.phone?'📞 <a href="tel:'+esc(state.phone)+'">'+esc(state.phone)+'</a>':'')+(state.mobile?' 📱 <a href="tel:'+esc(state.mobile)+'">'+esc(state.mobile)+'</a>':'')+(state.note?' ・ '+esc(state.note):'')+'</div>'}
  var mine=who?orders.find(function(o){return o.id===idFor(who)}):null;
  h+='<div class="card"><h2>'+(proxyMode?'代點模式：幫同事點':'菜單（點選品項）')+'</h2>'+(proxyMode&&!closed?'<input id="pname" placeholder="同事名字" value="'+esc(pname)+'">':'');
  if(!closed)h+=whoSelect();
  (state.menu||[]).forEach(function(m){
    var q=cartQty(m.no);
    h+='<div class="item'+(q?' on':'')+'"><span>'+m.no+'. '+esc(m.name)+' <span class="price">$'+m.price+'</span></span>'+(closed?(q?'<b>x'+q+'</b>':''):'<span class="qty"><button class="g" data-dec="'+m.no+'">−</button><b>'+q+'</b><button data-inc="'+m.no+'">+</button></span>')+'</div>';
    if(m.opts&&q>0)m.opts.forEach(function(op,oi){var key=m.no+":"+oi,oq=cartQty(key);h+='<div class="item" style="margin-left:18px;border-style:dashed"><span>↳ '+esc(op.name)+' <span class="price">+$'+op.price+'</span></span>'+(closed?(oq?'<b>x'+oq+'</b>':''):'<span class="qty"><button class="g" data-odec="'+key+'">−</button><b>'+oq+'</b><button data-oinc="'+key+'">+</button></span>')+'</div>'});
  });
  if(!closed){
    h+='<input id="note" placeholder="備註（例如：少飯、不要香菜）" value="'+esc(draftOrderNote!==null?draftOrderNote:(mine?mine.note||"":""))+'">';
    h+='<div class="row"><button id="send" style="flex:1">'+(proxyMode?'新增代點':(mine?'更新我的訂單':'送出訂單'))+'（$'+cartTotal()+'）</button>'+(mine?'<button class="g" id="cancel">取消</button>':'')+'</div>';
  }
  if(mine){h+='<div class="mine">✅ 你已訂：'+esc(describe(itemsOf(mine)))+(mine.note?'（'+esc(mine.note)+'）':'')+'</div>'}
  h+='</div>';
  h+=stats();
  h+=pendingCard();
  if(isOrg){
    h+='<div class="card"><h2>團主操作</h2><div class="row"><button id="copy" class="g" style="flex:1">複製統計文字</button><button id="end">'+(state.status==='open'?'結單':'關閉並開新團')+'</button></div>'+(state.status==='open'?'<div class="row" style="margin-top:8px"><button id="back" class="g" style="flex:1">↩ 返回選店家（取消這一團）</button></div>':'')+'</div>';
  }
  if(isOrg&&manualCopy){h+='<div class="card"><h2>請手動複製下方文字</h2><textarea readonly style="min-height:160px">'+esc(manualCopy)+'</textarea><button class="g" data-closecopy="1">收起</button></div>'}
  a.innerHTML=h;
}
function setupForm(){
  var h='<div class="card"><h2>開新團</h2>';
  if(!shops.length){h+='<div class="empty">目前沒有店家</div>'}
  else{h+='<select id="pick">'+shops.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'（'+s.menu.length+' 項）</option>'}).join('')+'</select><button id="open" style="width:100%">開團</button>'}
  h+='</div><div class="card"><h2>店家管理</h2>';
  shops.forEach(function(s){h+='<div class="line"><span>'+esc(s.name)+(s.phone||s.mobile?'<br><small class="price">'+esc([s.phone,s.mobile].filter(Boolean).join(' / '))+'</small>':'')+'</span><span><button class="g" data-menu="'+esc(s.id)+'">菜單</button> <button class="g" data-edit="'+esc(s.id)+'">編輯</button> <button class="g" data-del="'+esc(s.id)+'">刪除</button></span></div>'+(previewShop===s.id?'<div style="padding:6px 0 10px;font-size:14px">'+s.menu.map(function(m,i){return (i+1)+'. '+esc(m.name)+' <span class="price">$'+m.price+(m.opts?'・可'+m.opts.map(function(o){return o.name+'+'+o.price}).join('、'):'')+'</span>'}).join('<br>')+'</div>':'')});
  if(!editId&&!adding)h+='<button class="g" data-newshop="1" style="margin-top:10px;width:100%">＋ 新增店家</button>';
  if(editId||adding){h+='<h2 style="margin-top:14px">'+(editId?'編輯店家':'新增店家')+'</h2><input id="sname" placeholder="店名" value="'+esc(draftName)+'"><input id="sphone" type="tel" placeholder="市話（選填）" value="'+esc(draftPhone)+'"><input id="smobile" type="tel" placeholder="行動電話（選填）" value="'+esc(draftMobile)+'"><input id="snote" placeholder="備註（選填）" value="'+esc(draftNote)+'"><textarea id="smenu" placeholder="一行一個品項：品名 價格&#10;雞腿飯 100">'+esc(draftMenu)+'</textarea><div class="row"><button id="saveshop" style="flex:1">儲存</button><button class="g" id="canceledit">取消</button></div>'}
  h+='</div>';
  return h;
}
function itemsOf(o){if(o.items)return o.items;if(o.item)return {[o.item]:1};return {}}
function curCart(){
  if(proxyMode)return pcart;
  if(cart!==null)return cart;
  var m=who?orders.find(function(o){return o.id===idFor(who)}):null;
  return m?JSON.parse(JSON.stringify(itemsOf(m))):{};
}
function cartQty(no){return curCart()[no]||0}
function lineOf(k){
  var p=String(k).split(":"),it=itemOf(Number(p[0]));if(!it)return null;
  if(p.length<2)return {it:it,base:true,name:it.name,price:it.price};
  var op=(it.opts||[])[Number(p[1])];if(!op)return null;
  return {it:it,base:false,name:it.name+"（"+op.name+"）",price:op.price};
}
function skey(k){var p=String(k).split(":");return Number(p[0])*100+(p.length>1?Number(p[1])+1:0)}
function cartTotal(){var c=curCart(),t=0;Object.keys(c).forEach(function(k){var L=lineOf(k);if(L)t+=L.price*c[k]});return t}
function describe(items){
  return Object.keys(items).sort(function(a,b){return skey(a)-skey(b)}).map(function(k){var L=lineOf(k);return L?L.name+(items[k]>1?' x'+items[k]:''):null}).filter(Boolean).join('、');
}
function idCard(){
  if(!roster.length||!me)return '';
  if(smap[me]&&!changing)return '<div class="sub">你是：<b>'+esc(smap[me])+'</b> <button class="g" data-change="1" style="padding:2px 8px">更換</button></div>';
  var depts=[];roster.forEach(function(r){if(depts.indexOf(r.dept)<0)depts.push(r.dept)});
  var h='<div class="card"><h2>請選擇你是誰（只需選一次）</h2>';
  depts.forEach(function(d){h+='<div style="margin-bottom:10px"><div class="sub" style="margin:0 0 6px">'+esc(d)+'</div><div class="names">'+roster.filter(function(r){return r.dept===d}).map(function(r){return '<button class="g" data-pick="'+esc(r.name)+'">'+esc(r.name)+'</button>'}).join('')+'</div></div>'});
  if(changing)h+='<button class="g" data-cancelpick="1">取消</button>';
  return h+'</div>';
}
function pendingCard(){
  if(!roster.length||!state)return '';
  var done={};rowsOf().forEach(function(x){done[x.who]=1});
  var left=roster.filter(function(r){return !done[r.name]});
  var h='<div class="card"><h2>尚未點餐（'+left.length+' 人）</h2>';
  if(!left.length)return h+'<div class="empty" style="padding:8px 0">全部都點了 🎉</div></div>';
  var depts=[];left.forEach(function(r){if(depts.indexOf(r.dept)<0)depts.push(r.dept)});
  depts.forEach(function(d){h+='<div class="line"><span>'+esc(d)+'</span><span style="text-align:right">'+esc(left.filter(function(r){return r.dept===d}).map(function(r){return r.name}).join('、'))+'</span></div>'});
  return h+'</div>';
}
function idFor(name){return "n-"+Array.from(name).map(function(c){return c.codePointAt(0).toString(16)}).join("-")}
function whoSelect(){
  if(!roster.length)return '';
  var depts=[];roster.forEach(function(r){if(depts.indexOf(r.dept)<0)depts.push(r.dept)});
  var h='<select id="who"><option value="">▼ 請選擇你的名字</option>';
  depts.forEach(function(d){h+='<optgroup label="'+esc(d)+'">'+roster.filter(function(r){return r.dept===d}).map(function(r){return '<option value="'+esc(r.name)+'"'+(r.name===who?' selected':'')+'>'+esc(r.name)+'</option>'}).join('')+'</optgroup>'});
  return h+'</select>';
}
function nameOf(uid,label){return label||smap[uid]||names[uid]||"某人"}
function histDesc(lines){return lines.map(function(l){return l.name+(l.qty>1?' x'+l.qty:'')}).join('、')}
function histView(){
  if(!hist.length)return '<div class="empty">還沒有紀錄。團主按「結單」後會自動存檔。</div>';
  var d=new Date(),ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),mt=0,mc=0;
  hist.forEach(function(x){if(x.date.indexOf(ym)===0)(x.orders||[]).forEach(function(o){if(o.uid===me){mt+=o.total;mc++}})});
  var h='<div class="card"><h2>本月我的午餐花費</h2><div class="tot" style="padding:0"><span>'+mc+' 次</span><span>$'+mt+'</span></div></div>';
  hist.forEach(function(x){
    var wd="日一二三四五六"[new Date(x.date+"T00:00:00").getDay()],on=openDay===x.id;
    h+='<div class="card"><div class="hd" data-hday="'+esc(x.id)+'"><span><b>'+esc(x.date)+'（'+wd+'）</b> '+esc(x.shop)+'</span><span><small>'+x.count+' 份・</small><b>$'+x.total+'</b></span></div>';
    if(on){
      h+='<div style="margin-top:10px">';
      (x.orders||[]).forEach(function(o){h+='<div class="line"><span>'+esc(nameOf(o.uid,o.label))+(o.uid===me?'（我）':'')+'：'+esc(histDesc(o.lines))+(o.note?'（'+esc(o.note)+'）':'')+'</span><span>$'+o.total+'</span></div>'});
      if(isOrg)h+='<div style="margin-top:10px"><button class="g" data-hdel="'+esc(x.id)+'">刪除這筆紀錄</button></div>';
      h+='</div>';
    }
    h+='</div>';
  });
  return h;
}
function rowsOf(){
  return orders.map(function(o){
    var it=itemsOf(o),t=0,n=0;
    Object.keys(it).forEach(function(k){var L=lineOf(k);if(L){t+=L.price*it[k];if(L.base)n+=it[k]}});
    return n?{id:o.id,proxy:!!o.label,who:nameOf(o.id,o.label),items:it,note:o.note||"",total:t,n:n}:null;
  }).filter(Boolean);
}
function summary(){
  var r=rowsOf(),cnt={},tot=0,n=0;
  r.forEach(function(x){tot+=x.total;n+=x.n;Object.keys(x.items).forEach(function(k){if(lineOf(k))cnt[k]=(cnt[k]||0)+x.items[k]})});
  var keys=Object.keys(cnt).sort(function(a,b){return skey(a)-skey(b)});
  return {r:r,cnt:cnt,keys:keys,tot:tot,n:n};
}
function stats(){
  var S=summary();
  if(!S.r.length)return '<div class="card"><h2>目前訂單</h2><div class="empty">還沒有人點餐</div></div>';
  var h='<div class="card"><h2>給店家（共 '+S.n+' 份）</h2>';
  S.keys.forEach(function(k){h+='<div class="line"><span>'+esc(lineOf(k).name)+'</span><span>x'+S.cnt[k]+'</span></div>'});
  var notes=S.r.filter(function(x){return x.note});
  if(notes.length){h+='<h2 style="margin-top:12px">備註</h2>';notes.forEach(function(x){h+='<div class="line"><span>'+esc(x.who)+'</span><span>'+esc(x.note)+'</span></div>'})}
  h+='</div><div class="card"><h2>每人明細</h2>';
  S.r.forEach(function(x){h+='<div class="line"><span>'+esc(x.who)+'：'+esc(describe(x.items))+'</span><span>$'+x.total+(isOrg&&x.proxy?' <button class="g" data-pdel="'+esc(x.id)+'" style="padding:2px 8px">刪</button>':'')+'</span></div>'});
  return h+'<div class="tot"><span>合計</span><span>$'+S.tot+'</span></div></div>';
}
function statsText(){
  var S=summary();
  var t="🍱 "+state.shop+"（共 "+S.n+" 份）\n"+((state.phone||state.mobile)?"📞 "+[state.phone,state.mobile].filter(Boolean).join(" / ")+"\n":"");
  t+=S.keys.map(function(k){return lineOf(k).name+" x"+S.cnt[k]}).join("\n");
  var notes=S.r.filter(function(x){return x.note});
  if(notes.length)t+="\n——備註——\n"+notes.map(function(x){return x.who+"："+x.note}).join("\n");
  t+="\n——明細——\n"+S.r.map(function(x){return x.who+"："+describe(x.items)+" $"+x.total}).join("\n")+"\n合計 $"+S.tot;
  return t;
}

document.addEventListener("click",async function(e){
  var t=e.target.closest("[data-hday],button");if(!t||!db)return;
  try{
    if(t.dataset.menu){previewShop=previewShop===t.dataset.menu?null:t.dataset.menu;render();return}
    if(t.dataset.pick){if(me){await db.collection("staffmap").doc(me).set({name:t.dataset.pick})}changing=false;render();return}
    if(t.dataset.change){changing=true;render();return}
    if(t.dataset.cancelpick){changing=false;render();return}
    if(t.dataset.closecopy){manualCopy=null;render();return}
    if(t.dataset.pmode){proxyMode=!proxyMode;draftOrderNote=null;render();return}
    if(t.dataset.pdel){if(askTwice("確定刪除這筆代點？",t.dataset.pdel)){await db.collection("orders").doc(t.dataset.pdel).delete()}return}
    if(t.dataset.view){view=t.dataset.view;render();return}
    if(t.dataset.hday){openDay=openDay===t.dataset.hday?null:t.dataset.hday;render();return}
    if(t.dataset.hdel){if(askTwice("確定刪除這筆紀錄？",t.dataset.hdel)){await db.collection("history").doc(t.dataset.hdel).delete()}return}
    if((t.dataset.oinc||t.dataset.odec)&&!pastDeadline()){
      if(!who){toast("請先在上方選擇你的名字");return}
      var key=t.dataset.oinc||t.dataset.odec,c2=curCart(),base=Number(key.split(":")[0]),oq=Math.max(0,Math.min(c2[base]||0,(c2[key]||0)+(t.dataset.oinc?1:-1)));
      if(oq)c2[key]=oq;else delete c2[key];
      if(proxyMode)pcart=c2;else cart=c2;render();return;
    }
    if((t.dataset.inc||t.dataset.dec)&&!pastDeadline()){
      if(!who){toast("請先在上方選擇你的名字");return}
      var no=Number(t.dataset.inc||t.dataset.dec),c=curCart(),q=Math.max(0,Math.min(20,(c[no]||0)+(t.dataset.inc?1:-1)));
      if(q)c[no]=q;else delete c[no];
      Object.keys(c).forEach(function(k){if(k.indexOf(no+":")===0&&c[k]>q){if(q)c[k]=q;else delete c[k]}});
      if(proxyMode)pcart=c;else cart=c;render();return;
    }
    if(t.id==="send"){
      var items=curCart();
      if(!Object.keys(items).length){toast("請先用 + 選擇品項");return}
      if(proxyMode){
        var pn=$("pname").value.trim();
        if(!pn){toast("請輸入同事名字");return}
        await db.collection("orders").doc("p-"+Date.now()).set({items:items,note:$("note").value.trim(),label:pn});
        pcart={};pname="";draftOrderNote=null;
      }else{
        if(!who){toast("請先選擇你的名字");return}
        await db.collection("orders").doc(idFor(who)).set({items:items,label:who,note:$("note").value.trim()});cart=null;draftOrderNote=null;
      }
    }
    if(t.id==="cancel"){if(who){await db.collection("orders").doc(idFor(who)).delete()}cart=null;draftOrderNote=null}
    if(t.id==="open"){
      var sh=shops.find(function(x){return x.id===$("pick").value});
      if(!sh){toast("請選店家");return}
      var shop=sh.name,menu=sh.menu.map(function(m,i){var o={no:i+1,name:m.name,price:m.price};if(m.opts)o.opts=m.opts;return o});
      await clearOrders();
      var d=new Date();
      await db.doc("state/current").set({shop:shop,phone:sh.phone||"",mobile:sh.mobile||"",note:sh.note||"",menu:menu,status:"open",date:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")});
    }
    if(t.dataset.newshop){editId=null;adding=true;draftName="";draftMenu="";draftPhone="";draftMobile="";draftNote="";render();return}
    if(t.id==="saveshop"){
      var nm=$("sname").value.trim(),mn=parseMenu($("smenu").value);
      var old=editId?shops.find(function(x){return x.id===editId}):null;
      if(mn&&old)mn.forEach(function(x){var y=(old.menu||[]).find(function(z){return z.name===x.name&&z.opts});if(y)x.opts=y.opts});
      if(!nm||!mn||!mn.length){if(mn)toast("請填店名與至少一個品項");return}
      await db.collection("shops").doc(editId||"s"+Date.now()).set({name:nm,menu:mn,phone:$("sphone").value.trim(),mobile:$("smobile").value.trim(),note:$("snote").value.trim()});
      editId=null;draftName="";draftMenu="";draftPhone="";draftMobile="";draftNote="";adding=false;render();
    }
    if(t.id==="canceledit"){adding=false;editId=null;draftName="";draftMenu="";draftPhone="";draftMobile="";draftNote="";render()}
    if(t.dataset.edit){
      var s=shops.find(function(x){return x.id===t.dataset.edit});
      if(s){editId=s.id;adding=false;draftName=s.name;draftPhone=s.phone||"";draftMobile=s.mobile||"";draftNote=s.note||"";draftMenu=s.menu.map(function(m){return m.name+" "+m.price}).join("\n");render()}
    }
    if(t.dataset.del){
      if(askTwice("確定刪除這家店？",t.dataset.del)){await db.collection("shops").doc(t.dataset.del).delete()}
    }
    if(t.id==="back"){
      if(orders.length&&!askTwice("返回會清除目前 "+orders.length+" 筆訂單且不存檔","back"))return;
      await clearOrders();await db.doc("state/current").delete();
      cart=null;pcart={};proxyMode=false;draftOrderNote=null;
    }
    if(t.id==="end"){
      if(state.status==="open"){
        var S=summary(),recs=orders.map(function(o){
          var it=itemsOf(o),ls=[],tot=0;
          Object.keys(it).forEach(function(k){var x=lineOf(k);if(x){ls.push({name:x.name,price:x.price,qty:it[k]});tot+=x.price*it[k]}});
          return ls.length?{uid:o.id,label:o.label||smap[o.id]||"",lines:ls,note:o.note||"",total:tot}:null;
        }).filter(Boolean);
        if(recs.length)await db.collection("history").doc(state.date+"-"+Date.now()).set({date:state.date,shop:state.shop,phone:state.phone||"",orders:recs,total:S.tot,count:S.n});
        await db.doc("state/current").update({status:"closed"});
      }
      else{await clearOrders();await db.doc("state/current").delete()}
    }
    if(t.id==="copy"){try{await navigator.clipboard.writeText(statsText());t.textContent="已複製 ✓"}catch(x){manualCopy=statsText();render()}}
  }catch(err){toast("操作失敗："+(err&&err.message||err))}
});
document.addEventListener("change",function(e){
  if(e.target.id==="who"){who=e.target.value;try{localStorage.setItem("who",who)}catch(x){}cart=null;draftOrderNote=null;render()}
});
document.addEventListener("input",function(e){
  if(e.target.id==="note")draftOrderNote=e.target.value;
  if(e.target.id==="pname")pname=e.target.value;
  if(e.target.id==="sname")draftName=e.target.value;
  if(e.target.id==="smenu")draftMenu=e.target.value;
  if(e.target.id==="sphone")draftPhone=e.target.value;
  if(e.target.id==="smobile")draftMobile=e.target.value;
  if(e.target.id==="snote")draftNote=e.target.value;
});
function parseMenu(text){
  var out=[],lines=text.split("\n");
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();if(!l)continue;
    var m=l.match(/^(.+?)\s+(\d+)$/);
    if(!m){toast("無法辨識：「"+l+"」\n格式：品名 價格");return null}
    out.push({name:m[1],price:Number(m[2])});
  }
  return out;
}
async function clearOrders(){
  var snap=await db.collection("orders").get();
  for(var i=0;i<snap.docs.length;i++){await db.collection("orders").doc(snap.docs[i].id).delete()}
}
async function loadNames(){
  var seen={};orders.forEach(function(o){if(!o.label)seen[o.id]=1});
  hist.forEach(function(x){(x.orders||[]).forEach(function(o){if(!o.label)seen[o.uid]=1})});
  var ids=Object.keys(seen);if(!ids.length)return;
  try{var ps=await user.profiles(ids);ids.forEach(function(i){names[i]=(ps[i]&&ps[i].name)||"某人"});render()}catch(e){}
}
(async function(){
  try{
    if(window.claude){
      db=await claude.use("db");user=await claude.use("user");
      if(db&&user){me=await user.id();isOrg=!!(await user.canEdit())}
      else{db=null}
    }
  }catch(e){db=null}
  ready=true;render();
  if(!db)return;
  db.doc("state/current").onSnapshot(function(s){state=s.exists?s.data():null;render()},function(){});
  db.doc("staff/roster").onSnapshot(function(sn){
    roster=[];if(sn.exists){((sn.data()||{}).depts||[]).forEach(function(d){(d.members||[]).forEach(function(m){roster.push({dept:d.name,name:m})})})}render();
  },function(){});
  db.collection("staffmap").onSnapshot(function(q){
    smap={};q.docs.forEach(function(d){smap[d.id]=(d.data()||{}).name});render();
  },function(){});
  db.collection("history").onSnapshot(function(q){
    hist=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})}).sort(function(a,b){return a.id<b.id?1:-1});render();loadNames();
  },function(){});
  db.collection("shops").onSnapshot(function(q){
    shops=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});render();
  },function(){});
  db.collection("orders").onSnapshot(function(q){
    orders=q.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});render();loadNames();
  },function(){});
})();
</script>
